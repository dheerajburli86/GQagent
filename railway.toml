# Railway reads this file automatically (it sits at the repo root).
#   - builds with the Dockerfile
#   - ONE replica: Telegram allows only one poller per bot token, and the
#     conversation memory and per-person limits live in this process. One
#     replica still answers many people at once: every question runs in
#     parallel (see server.js), bounded by AGENT_MAX_PARALLEL_MODEL_CALLS.
#   - health check on /health; POST /api/chat serves the GQ XRayDar dashboard
#     panel (public domain gqagent-production.up.railway.app)
#   - drainingSeconds: on a deploy the old container finishes answers in progress
#   - settings and budgets are written to /data: attach a Railway volume there
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
drainingSeconds = 65
